name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] ruff
      - name: Lint (errors + pyflakes; style rules intentionally narrow, see README)
        run: ruff check sentinel tests --select F,E9
      - name: Test with coverage
        run: |
          python -m pytest tests/ -q \
            --cov=sentinel --cov-report=term-missing --cov-report=xml
        env:
          # LLM-dependent tests degrade gracefully without keys
          OPENROUTER_API_KEY: ""
          GEMINI_API_KEY: ""
      - name: Smoke scan (sandboxed end-to-end on a seeded-bug sample)
        run: |
          scan_status=0
          python -m sentinel.cli scan samples/slugify.py::slugify \
            --out /tmp/smoke --budget 10 --max-executions 150 --seed 7 || scan_status=$?
          # Exit 1 means the deliberately seeded defect was found; 2 is an error.
          test "$scan_status" -eq 1
          test -s /tmp/smoke/report.json
